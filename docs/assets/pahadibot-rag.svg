<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-labelledby="t d">
  <title id="t">PahadiBot retrieval flow</title>
  <desc id="d">A question is matched against fact cards rendered from every computed dashboard number using TF-IDF and cosine similarity; only the top-matching cards go into the Groq prompt, and the answer is grounded in them. Zone and limitation questions pull in every card of that topic.</desc>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .h{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;fill:#C0583A}
    .lbl{font-size:13px;font-weight:600;fill:#2B2622}
    .sub{font-size:11px;fill:#7A7068}
    .box{fill:#FFFFFF;stroke:#D9CFC3;stroke-width:1.2}
    .accent{fill:#F6E6DD;stroke:#C0583A}
    .card{fill:#FFFFFF;stroke:#D9CFC3;stroke-width:1}
    .hit{animation:hit 4s ease-in-out infinite}
    .h2{animation-delay:.4s}.h3{animation-delay:.8s}
    .flow{fill:none;stroke:#C0583A;stroke-width:2;stroke-dasharray:6 10;animation:flow 1.4s linear infinite}
    .type{animation:type 4s steps(1) infinite}
    @keyframes hit{0%,30%{fill:#FFFFFF;stroke:#D9CFC3}45%,85%{fill:#F6E6DD;stroke:#C0583A}100%{fill:#FFFFFF;stroke:#D9CFC3}}
    @keyframes flow{to{stroke-dashoffset:-32}}
    @keyframes type{0%,60%{opacity:0}65%,95%{opacity:1}100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.hit,.flow,.type{animation:none}.type{opacity:1}}
  </style>

  <rect fill="#FBF8F3" width="960" height="320" rx="16"/>

  <text class="h" x="28" y="40">Ask</text>
  <text class="h" x="210" y="40">Fact cards</text>
  <text class="h" x="430" y="40">Retrieve</text>
  <text class="h" x="620" y="40">Generate</text>
  <text class="h" x="800" y="40">Answer</text>

  <!-- question -->
  <rect class="box" x="28" y="110" width="160" height="76" rx="14"/>
  <text class="lbl" x="42" y="138">“Which zone is</text>
  <text class="lbl" x="42" y="156">most vulnerable?”</text>
  <text class="sub" x="42" y="176">POST /api/chat</text>
  <path class="flow" d="M188 148 L210 148"/>

  <!-- cards -->
  <rect class="card" x="210" y="60" width="190" height="34" rx="7"/><text class="sub" x="222" y="81">TVI town-wide = …</text>
  <rect class="card hit" x="210" y="100" width="190" height="34" rx="7"/><text class="sub" x="222" y="121">Zone Zx TVI = … (rank 1)</text>
  <rect class="card hit h2" x="210" y="140" width="190" height="34" rx="7"/><text class="sub" x="222" y="161">Zone Zy water stress = …</text>
  <rect class="card" x="210" y="180" width="190" height="34" rx="7"/><text class="sub" x="222" y="201">Irridex: RII = … (Apathy)</text>
  <rect class="card hit h3" x="210" y="220" width="190" height="34" rx="7"/><text class="sub" x="222" y="241">K-means archetype of Zx …</text>
  <text class="sub" x="210" y="280">one card per computed number</text>
  <path class="flow" d="M400 158 L430 158"/>

  <!-- retrieve -->
  <rect class="box accent" x="430" y="96" width="170" height="124" rx="10"/>
  <text class="lbl" x="444" y="122">TF-IDF + cosine</text>
  <text class="sub" x="444" y="144">rank cards vs. question,</text>
  <text class="sub" x="444" y="160">keep top-k</text>
  <text class="sub" x="444" y="184">zone / limitation queries</text>
  <text class="sub" x="444" y="200">→ pull the whole topic</text>
  <text class="sub" x="430" y="244">no embeddings download;</text>
  <text class="sub" x="430" y="260">recall@k eval in tests/</text>
  <path class="flow" d="M600 158 L620 158"/>

  <!-- generate -->
  <rect class="box" x="620" y="110" width="160" height="96" rx="10"/>
  <text class="lbl" x="634" y="136">Groq</text>
  <text class="sub" x="634" y="156">openai/gpt-oss-120b</text>
  <text class="sub" x="634" y="174">3-key fallback pool</text>
  <text class="sub" x="634" y="192">no key → raw context</text>
  <path class="flow" d="M780 158 L800 158"/>

  <!-- answer -->
  <rect class="box" x="800" y="104" width="136" height="108" rx="14"/>
  <g class="type">
    <text class="lbl" x="814" y="132">Zone Zx, TVI …</text>
    <text class="sub" x="814" y="152">driven by water</text>
    <text class="sub" x="814" y="168">stress and economic</text>
    <text class="sub" x="814" y="184">precarity</text>
  </g>
  <text class="sub" x="800" y="236">grounded in the</text>
  <text class="sub" x="800" y="252">retrieved cards only</text>

  <circle r="4.5" fill="#C0583A"><animateMotion dur="4s" repeatCount="indefinite" keyTimes="0;0.3;0.5;0.65;1" keyPoints="0;0.3;0.55;0.8;1" calcMode="linear" path="M188 148 L210 148 L400 158 L430 158 L600 158 L620 158 L780 158 L800 158"/></circle>
</svg>
