<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tourism vulnerability and carrying-capacity dashboard for Nainital." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Nainital Tourism Vulnerability Dashboard</title>
    <script>
      // Stamp the motion setting before first paint. React's MotionProvider owns
      // this attribute from mount onward, but CSS animations start at first
      // paint -- without this, a reader who asked for reduced motion still gets
      // one frame of fluttering prayer flags before the app hydrates.
      (function () {
        try {
          var stored = localStorage.getItem("nainital:motion");
          var reduced =
            stored === "reduced" ||
            (stored !== "full" && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
          document.documentElement.dataset.motion = reduced ? "reduced" : "full";
        } catch (e) {
          document.documentElement.dataset.motion = "full";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
